global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "mysql"
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
  
  - job_name: "flask-app"
    static_configs:
      - targets: ["flask-app:5000"]